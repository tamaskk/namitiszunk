name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      # CI has no secrets; the env schema itself is covered by packages/config tests.
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Download the MongoDB binary once; parallel test packages otherwise race on its lockfile.
      - run: pnpm --filter @namitiszunk/db exec node -e "import('mongodb-memory-server').then((m) => m.MongoBinary.getPath())"
      - run: pnpm exec turbo run lint typecheck test build
      - run: pnpm --filter @namitiszunk/validators lint:openapi
      # Inside `verify` so branch protection needs no new required check.
      - run: pnpm --filter @namitiszunk/admin exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # T-049 on the production build from the step above: the JS budget fails the PR, LCP only warns.
      - run: pnpm --filter @namitiszunk/order test:perf
      # LHCI uses the runner's preinstalled Google Chrome, not Playwright's chromium.
      - run: pnpm --filter @namitiszunk/order lighthouse

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
